# Secrets Store CSI Driver - Azure Key Vault SecretProviderClass
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-provider
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "11111111-2222-3333-4444-555555555555"
    keyvaultName: "prod-enterprise-keyvault"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: DatabaseConnectionString
          objectType: secret
          objectVersion: ""
        - |
          objectName: ApiSigningKey
          objectType: key
          objectVersion: ""
    tenantId: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
  secretObjects:
  - secretName: synced-database-secret
    type: Opaque
    data:
    - objectName: DatabaseConnectionString
      key: connection-string
---
# Sample Pod Mounting Key Vault Secrets
apiVersion: v1
kind: Pod
metadata:
  name: app-using-keyvault-secrets
  namespace: default
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: entra-workload-sa
  containers:
  - name: webapp
    image: nginx:alpine
    volumeMounts:
    - name: secrets-store-inline
      mountPath: "/mnt/secrets-store"
      readOnly: true
    env:
    - name: DB_CONNECTION
      valueFrom:
        secretKeyRef:
          name: synced-database-secret
          key: connection-string
  volumes:
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: azure-kv-provider\n