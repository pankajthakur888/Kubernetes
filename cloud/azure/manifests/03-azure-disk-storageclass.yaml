# Azure Managed Disk StorageClass (Premium SSD v2 / Zone Redundant)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: managed-premium-zrs
provisioner: disk.csi.azure.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  skuName: Premium_ZRS
  cachingMode: None
---
# PVC Requesting 200Gi Zone-Redundant Disk
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mssql-data-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: managed-premium-zrs
  resources:
    requests:
      storage: 200Gi\n