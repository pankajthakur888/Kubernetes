---
# 1. Kubernetes ServiceAccount with AWS IAM Role annotation (IRSA)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader-sa
  namespace: default
  annotations:
    # Maps directly to an IAM Role via AWS STS AssumeRoleWithWebIdentity
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ProductionS3ReaderRole
    eks.amazonaws.com/sts-regional-endpoints: "true"

---
# 2. Application Deployment utilizing the ServiceAccount
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-sync-worker
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s3-sync
  template:
    metadata:
      labels:
        app: s3-sync
    spec:
      serviceAccountName: s3-reader-sa
      containers:
        - name: aws-cli
          image: amazon/aws-cli:latest
          command: ["sh", "-c", "aws s3 ls s3://my-enterprise-data-bucket; sleep 3600"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"\n